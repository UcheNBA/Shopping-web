{% extends 'base.html' %}
{% block title %}Edit {{ product.name }} - Admin{% endblock %}
{% block content %}
<h1>Edit Product</h1>
<form method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label>Name
    <input name="name" value="{{ product.name }}" required>
  </label>

  <label>Price:
    <input name="price" type="number" step="0.01" value="{{ product.price }}" required>
  </label><br><br>

  <label style="margin-top:.5rem">Category
    <select name="category">
      <option value="">(none)</option>
      {% for c in ['men','women','bags','sports','musical','kids'] %}
        <option value="{{ c }}" {% if product.category == c %}selected{% endif %}>{{ c|capitalize }}</option>
      {% endfor %}
    </select>
  </label>

  {% if product.image %}
    <p>Current image:</p>
    <img class="thumb product-image-zoomable" src="{{ product.image if product.image.startswith('http') else url_for('static', filename=product.image) }}" alt="{{ product.name }}"><br><br>
  {% endif %}

  <div class="row" style="margin-top:.5rem">
    <label style="flex:1">Replace image
      <input type="file" name="image" accept="image/*">
    </label>
  </div>

 

  

  <label style="margin-top:.5rem">Description
    <textarea name="description">{{ product.description }}</textarea>
  </label>

  <div style="margin-top:.5rem;display:flex;gap:0.5rem">
    <button class="btn" type="submit">Save</button>
    <a class="btn ghost" href="/admin">Cancel</a>
  </div>
</form>
{% endblock %}

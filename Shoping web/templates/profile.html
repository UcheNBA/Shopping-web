{% extends 'base.html' %}
{% block title %}Your Profile - My Shop{% endblock %}
{% block content %}
<div style="max-width:620px;margin:0 auto">
  <h1>Your Profile</h1>
  {% if error %}<p style="color:#b91c1c">{{ error }}</p>{% endif %}
  {% if success %}<p style="color:green">{{ success }}</p>{% endif %}
  <form method="post" style="background:var(--card);padding:1rem;border-radius:12px;box-shadow:0 8px 24px rgba(16,24,40,0.06)">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Full name
      <input name="full_name" value="{{ user.full_name }}">
    <label>Email
      <input name="email" type="email" value="{{ user.email }}">
    <label>Age
      <input name="age" type="number" min="0" value="{{ user.age }}">
    </label>
    <label>Date of birth
      <input name="dob" type="date" value="{{ user.dob }}">
    </label>
    <label>State of origin
      <input name="state" value="{{ user.state }}">
    </label>
    <label>Country
      <input name="country" value="{{ user.country }}">
    </label>
    <label>Address
      <input name="address" value="{{ user.address }}">
    </label>
    <label>Phone number
      <input name="phone" value="{{ user.phone }}">
    </label>
    <div style="margin-top:.5rem">
      <button class="btn" type="submit">Save</button>
      <a class="btn ghost" href="/">Back</a>
    </div>
  </form>
</div>
{% endblock %}

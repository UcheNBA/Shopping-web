{% extends 'base.html' %}
{% block title %}Review {{ product.name }}{% endblock %}
{% block content %}
<style>
.rating-stars {
  display: inline-block;
  font-size: 2rem;
  direction: rtl; /* Right to left to make hover work correctly */
}
.rating-stars input[type="radio"] {
  display: none;
}
.rating-stars label {
  color: #ddd;
  cursor: pointer;
  transition: color 0.2s;
}
.rating-stars input[type="radio"]:checked ~ label,
.rating-stars label:hover,
.rating-stars label:hover ~ label {
  color: #ffd166;
}
</style>

<div style="max-width:600px;margin:0 auto">
  <h1>Review "{{ product.name }}"</h1>
  <p>From Order #{{ order_id }}</p>
  {% if error %}<p style="color:var(--danger)">{{ error }}</p>{% endif %}

  <form method="post" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    
    <label for="rating">Your Rating</label>
    <div class="rating-stars">
      <input type="radio" id="star5" name="rating" value="5" required/><label for="star5" title="5 stars">★</label>
      <input type="radio" id="star4" name="rating" value="4" /><label for="star4" title="4 stars">★</label>
      <input type="radio" id="star3" name="rating" value="3" /><label for="star3" title="3 stars">★</label>
      <input type="radio" id="star2" name="rating" value="2" /><label for="star2" title="2 stars">★</label>
      <input type="radio" id="star1" name="rating" value="1" /><label for="star1" title="1 star">★</label>
    </div>

    <label for="comment" style="margin-top: 1rem;">Your Review</label>
    <textarea name="comment" placeholder="Tell us what you thought..."></textarea>

    <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
      <button type="submit" class="btn">Submit Review</button>
      <a href="{{ url_for('my_orders') }}" class="btn ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

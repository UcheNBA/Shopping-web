{% extends 'base.html' %}
{% block title %}Reset Password - My Shop{% endblock %}
{% block content %}
<div style="max-width:420px;margin:0 auto">
  <h1 style="margin-top:0">Reset Password</h1>
  {% if error %}
    <div style="background:#fee2e2;color:#b91c1c;padding:1rem;border-radius:8px;margin-bottom:1rem">
        {{ error }}
    </div>
    <a class="btn" href="/forgot-password">Try Again</a>
  {% else %}
  <form method="post" style="background:var(--card);padding:1rem;border-radius:12px;box-shadow:0 8px 24px rgba(16,24,40,0.06)">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>New Password
      <div style="position:relative">
        <input id="reset-pass" name="password" type="password" required style="width:100%;padding-right:2.5rem;box-sizing:border-box">
        <button type="button" onclick="togglePass()" style="position:absolute;right:0;top:0;height:100%;background:none;border:none;cursor:pointer;color:var(--text);padding:0 .75rem;font-size:1.1rem;">
          <i class="fas fa-eye" id="reset-eye"></i>
        </button>
      </div>
    </label>
    <div style="margin-top:1rem">
      <button class="btn" type="submit">Update Password</button>
    </div>
  </form>
  <script>
    function togglePass() {
      var x = document.getElementById("reset-pass");
      var i = document.getElementById("reset-eye");
      if (x.type === "password") {
        x.type = "text"; i.classList.remove("fa-eye"); i.classList.add("fa-eye-slash");
      } else {
        x.type = "password"; i.classList.remove("fa-eye-slash"); i.classList.add("fa-eye");
      }
    }
  </script>
  {% endif %}
</div>
{% endblock %}

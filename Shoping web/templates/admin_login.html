{% extends 'base.html' %}
{% block title %}Admin Login - My Shop{% endblock %}
{% block content %}
<div style="max-width:420px;margin:0 auto">
  <h1 style="margin-top:0">Admin Login</h1>
  {% if error %}<p style="color:#b91c1c">{{ error }}</p>{% endif %}
  <form method="post" style="background:var(--card);padding:1rem;border-radius:12px;box-shadow:0 8px 24px rgba(16,24,40,0.06)">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" required>
    </label>
    <label>Password
      <input name="password" type="password" required>
    </label>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:.5rem">
      <button class="btn" type="submit">Sign in</button>
      <a class="btn ghost" href="/">Back</a>
    </div>
  </form>
</div>
{% endblock %}
